name: build

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the build job only checks out + compiles/tests, so read is
# enough. Making it explicit closes zizmor's excessive-permissions finding ahead
# of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

concurrency:
  # Cancel in-flight builds on the same PR / branch when a new push
  # arrives — only the latest commit matters for the required check.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26: the package floor is macOS 26 — `swift test` executes the
    # built binaries, and a macos-15 host cannot load minos-26 images.
    runs-on: macos-26
    # Bounded so a hung `swift build` can't burn 6 h of free macOS minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Build-only: swift-build compiles and tests locally, never pushes —
          # drop the persisted checkout token. t-yaxa
          persist-credentials: false

      # Shared Swift build (setup-xcode + SPM cache + build + test). sill is
      # LIBRARY-ONLY (no .app) so — unlike facet — there is no ./package.sh
      # step. XCTest also runs LOCALLY now via `scripts/test.sh` (an installed
      # Xcode over the CLT-default shell); CI is the canonical required gate.
      - uses: akira-toriyama/.github/actions/swift-build@v2.1.3

  # appkit-floor — the 3-floor AppKit policy, machine-enforced.
  #
  # A pure source scan: no toolchain, no checkout depth, seconds on the cheapest
  # runner. Split from `build` so a policy drift is reported as its own red
  # check rather than buried in a 20-minute compile.
  appkit-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/appkit-floor.sh
      # Interaction alphas live in PaletteKit, not inline in each widget.
      - run: scripts/interaction-alphas.sh
      # A public themed widget must accept the ambient theme, not only a prop.
      - run: scripts/theme-env.sh
      # A file that drives an animation must honour Reduce Motion.
      - run: scripts/reduce-motion.sh

  # api-guard — a removal from the public surface must be RATED major.
  #
  # Separate job, not a step of `build`: it checks out the FULL history (the
  # baseline is a second revision) and installs glyph, neither of which the
  # build job should carry. It also builds both revisions, so folding it into
  # `build` would roughly triple that job's wall clock for every PR.
  #
  # PR-only. On a push to main the baseline would be the previous commit, which
  # re-litigates a decision already made at merge time.
  api-guard:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs HEAD against the PR base, so it needs both revisions
          # — a shallow checkout has only one.
          fetch-depth: 0
          persist-credentials: false

      # glyph is the ONLY reader of the declared bump level, so the gate and the
      # release can never disagree about what a commit means. Pinned to a
      # concrete release; the action verifies checksum + build provenance.
      - uses: akira-toriyama/glyph/.github/actions/install@v0.12.0
        with:
          version: v0.12.0
          token: ${{ github.token }}

      # `github.event.pull_request.base.sha` is the merge-base GitHub itself
      # computed for this PR — passed explicitly rather than recomputed, so the
      # gate blames this branch for its OWN removals only.
      - name: api-guard
        run: scripts/api-guard.sh "${{ github.event.pull_request.base.sha }}"

  # swift-bite — this pull request's new/changed Swift tests (XCTest and
  # swift-testing alike) run against the source BEFORE the pull request, and
  # the job fails when every one of them still passes: a test that would have
  # been green without the fix it accompanies is not evidence. It stands down,
  # green and explained, when there is nothing to prove — safe as a required
  # check. Verdict rules and the two opt-outs (`bite-exempt: <reason>` above a
  # test / a `Bite-exempt:` commit trailer): akira-toriyama/.github
  # docs/swift-bite.md. Live-ammunition record: swift-toml-edit#29.
  bite:
    uses: akira-toriyama/.github/.github/workflows/swift-bite.yml@v2.1.3
